name: Publish to NuGet

# Push a tag, get packages. `git tag v2.0.1 && git push origin v2.0.1` publishes
# 2.0.1 of all six; the workflow_dispatch input is the same thing without a tag, for
# a re-run after a failed push.
#
# Not on every push to main: these are public package ids and a version can never be
# taken back, only unlisted. A tag is a deliberate act, which is the property wanted
# here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 2.0.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    # Trusted Publishing, so there is no long-lived NuGet key anywhere in this repo.
    # The job asks GitHub for a signed OIDC token describing this exact repository and
    # workflow file, nuget.org checks it against the policy registered under the
    # ReverseBlade account, and hands back an API key valid for one hour.
    #
    # The matching policy names OnurGumus / Fable.Lit / nuget.yml and no environment.
    # Renaming this file breaks publishing until the policy is updated to match, which
    # is the point: the file name is part of what is being trusted.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink stamps the commit into the symbols, and a shallow clone with no
          # history gives it nothing to stamp.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag is the version. `v2.0.1` publishes 2.0.1, and the version in
      # src/Directory.Build.props is only what a local pack produces.
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # The version goes to the build as well as the pack. With it on the pack alone,
      # `--no-build` below would write the tag's version into the nuspec while the
      # assembly inside still carried whatever src/Directory.Build.props says, so a
      # package labelled 2.0.1 would contain an assembly calling itself 2.0.0.
      - name: Build
        run: dotnet build Fable.Lit.sln -c Release -p:Version=${{ steps.version.outputs.value }}

      # Each project by name rather than the solution, which would also try to pack the
      # test and sample projects.
      #
      # Deliberately not gated on `npm test`. Three directive tests (onChange,
      # ofPromise, ofImport) have been failing since before this fork existed, and
      # gating on them would mean never publishing anything. Make this a gate once they
      # are fixed; until then CI reports them on every push and this does not block.
      - name: Pack
        run: |
          for p in Lit Lit.Elmish Lit.Test Lit.Feliz Lit.React ConstructStyleSheetsPolyfill; do
            dotnet pack "src/$p/$p.fsproj" -c Release --no-build \
              -o nupkgs -p:Version=${{ steps.version.outputs.value }}
          done
          ls -la nupkgs

      # Last, and deliberately: the key this returns lives for an hour, and each OIDC
      # token buys exactly one key. Asking before the build would spend it on a run
      # that might never reach the push.
      #
      # `user` is the nuget.org profile name, not an email address. It is on the front
      # of every package this account owns, so it is written here rather than kept in a
      # secret; move it to one if that ever stops being true.
      - name: Exchange the OIDC token for a short-lived key
        uses: NuGet/login@v1
        id: login
        with:
          user: ReverseBlade

      # --skip-duplicate so a re-run after a partial failure pushes what is missing
      # instead of failing on what already landed. The .snupkg symbol packages beside
      # each .nupkg go up with them.
      - name: Push
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

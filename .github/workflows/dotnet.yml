name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore dependencies
      run: npm install
    # Builds every project, including the sample, which the test run does not cover.
    - name: Build
      run: dotnet build Fable.Lit.slnx -c Release
    # Before npm test: this writes test/server-rendered.json, which the browser-side
    # differential test fetches to compare lit's DOM against the .NET renderer's HTML.
    - name: Test (.NET)
      run: dotnet test test/Lit.Server.Tests/Lit.Server.Tests.fsproj -c Release
    - name: Test (browser)
      run: npm test

name: Publish docs site

# Renamed from "Publish", which now means NuGet: see nuget.yml. This one builds the
# nacara documentation site and pushes it to gh-pages.
#
# Manual only. It used to run on every push to main, which on a fork means publishing
# a second copy of somebody else's documentation site, and it would not get that far
# anyway: it pins node 14.17, which current runners no longer offer. Left otherwise
# untouched, because modernising nacara is its own job and nothing depends on this
# site today.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-dotnet@v2.1.0
      - uses: actions/setup-node@v2
        with:
          node-version: 14.17.*
      - name: Install and use custom node version
        run: npm i -g npm@7
      - name: Restore dependencies
        run: npm install
      - name: Build site
        run: npm run docs
      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs
